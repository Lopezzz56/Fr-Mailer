<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusRealm Mail Merge</title>
    <meta name="description" content="FocusRealm Mail Merge — Personalised outreach from your own mailbox, with approval before anything sends." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('focusrealm-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0B101E');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Splash shown until the app's first render replaces #root. Kept inline so it appears before any JS or CSS. */
      .fr-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F6F8FC;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;animation:fr-in .25s ease-out both}
      .dark .fr-splash{background:#0B101E}
      .fr-splash p{margin:0}
      .fr-splash .t{margin-top:20px;font-size:18px;font-weight:700;letter-spacing:-.015em;color:#0F172A}
      .dark .fr-splash .t{color:#F8FAFC}
      .fr-splash .s{margin-top:2px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#64748B}
      .dark .fr-splash .s{color:#94A3B8}
      .fr-splash .bar{position:relative;width:192px;height:4px;margin-top:24px;border-radius:99px;background:#E2E8F0;overflow:hidden}
      .dark .fr-splash .bar{background:#1E2B45}
      .fr-splash .bar i{position:absolute;inset:0 auto 0 0;width:40%;border-radius:99px;background:linear-gradient(90deg,transparent,#1E5AE6,#D4AF67,transparent);animation:fr-bar 1.3s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes fr-in{from{opacity:0}to{opacity:1}}
      @keyframes fr-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){.fr-splash,.fr-splash *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fr-splash" role="status" aria-live="polite">
        <div style="width:56px;height:56px;overflow:hidden;border-radius:14px;box-shadow:0 4px 14px rgba(11,20,46,0.25)">
          <img src="/focusrealm_logo.png" alt="FocusRealm" width="56" height="56" style="display:block;transform:scale(1.4)" />
        </div>
        <p class="t">FocusRealm</p>
        <p class="s">Mail Merge</p>
        <div class="bar"><i></i></div>
        <noscript><p style="margin-top:16px;font-size:13px;color:#475569">FocusRealm Mail Merge needs JavaScript turned on.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
